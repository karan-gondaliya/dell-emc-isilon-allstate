## All options defined here are available to all instances.
#
init_config:

    ## @param service - string - optional
    ## Attach the tag `service:<SERVICE>` to every metric, event, and service check emitted by this integration.
    ##
    ## Additionally, this sets the default `service` for every log source.
    #
    # service: <SERVICE>

## Every instance is scheduled independently of the others.
## Configure one instance for each Isilon cluster.
#
instances:

    ## First Isilon cluster.
    ##
    ## @param ip_address - string - required
    ## IP Address needed in URL
    #
  - ip_address: <CLUSTER_1_IP_ADDRESS>

    ## @param username - string - required
    ## Username for API call
    #
    username: <USERNAME>

    ## @param password - string - required
    ## Password for API call
    #
    password: <PASSWORD>

    ## @param port - string - required
    ## Port for API call
    #
    port: '8080'

    ## @param certificate_path - string - optional
    ## Absolute Path of the SSL Certificate
    #
    # certificate_path: <ABSOLUTE_PATH_TO_CERTIFICATE>

    ## @param zone_export_ids - mapping - optional
    ## Access zones to fetch the NFS stats from, with the Export IDs of each zone.
    ## Export IDs are unique only within an access zone.
    ##   ""       collects all exports of the zone.
    ##   "1,3"    collects only these Export IDs of the zone.
    ##   "-2,-4"  collects all exports of the zone except these Export IDs.
    ## Only the listed access zones are collected. Add  System: ""  to also collect the System zone.
    ## An access zone cannot have both Export IDs to collect and Export IDs to exclude.
    ## It cannot be used together with export_ids, so remove export_ids if it is set.
    #
    zone_export_ids:
      NGIC-NFS: ""
      NGLS-NFS: ""

    ## @param dataset_ids - string - optional
    ## Comma-Separated Dataset IDs to fetch the NFS stats with Metric as Export ID. Value must be enclosed in quotes
    #
    # dataset_ids: "1,3"

    ## @param export_ids - string - optional
    ## Comma-Separated Export IDs of the System access zone to fetch the NFS stats. Value must be enclosed in quotes.
    ## Cannot be used with zone_export_ids.
    #
    # export_ids: "16,17"

    ## @param tags - list of strings - optional
    ## A list of tags to attach to every metric and service check emitted by this instance.
    ##
    ## Learn more about tagging at https://docs.datadoghq.com/tagging
    #
    # tags:
    #   - <KEY_1>:<VALUE_1>
    #   - <KEY_2>:<VALUE_2>

    ## @param service - string - optional
    ## Attach the tag `service:<SERVICE>` to every metric, event, and service check emitted by this instance.
    ##
    ## Overrides any `service` defined in the `init_config` section.
    #
    # service: <SERVICE>

    ## @param min_collection_interval - number - required
    ## This changes the collection interval of the check. For more information, see:
    ## https://docs.datadoghq.com/developers/write_agent_check/#collection-interval
    #
    min_collection_interval: 120

    ## @param empty_default_hostname - boolean - optional - default: false
    ## This forces the check to send metrics with no hostname.
    ##
    ## This is useful for cluster-level checks.
    #
    # empty_default_hostname: false

    ## @param metric_patterns - mapping - optional
    ## A mapping of metrics to include or exclude, with each entry being a regular expression.
    ##
    ## Metrics defined in `exclude` will take precedence in case of overlap.
    #
    # metric_patterns:
    #   include:
    #   - <INCLUDE_REGEX>
    #   exclude:
    #   - <EXCLUDE_REGEX>

    ## Second Isilon cluster. Delete this instance if you only monitor one cluster.
    ## It takes the same options as the first instance.
    ##
    ## @param ip_address - string - required
    ## IP Address needed in URL
    #
  - ip_address: <CLUSTER_2_IP_ADDRESS>

    ## @param username - string - required
    ## Username for API call
    #
    username: <USERNAME>

    ## @param password - string - required
    ## Password for API call
    #
    password: <PASSWORD>

    ## @param port - string - required
    ## Port for API call
    #
    port: '8080'

    ## @param certificate_path - string - optional
    ## Absolute Path of the SSL Certificate
    #
    # certificate_path: <ABSOLUTE_PATH_TO_CERTIFICATE>

    ## @param zone_export_ids - mapping - optional
    ## Access zones to fetch the NFS stats from, with the Export IDs of each zone.
    #
    zone_export_ids:
      NGIC-NFS: ""
      NGLS-NFS: ""

    ## @param min_collection_interval - number - required
    ## This changes the collection interval of the check.
    #
    min_collection_interval: 120
